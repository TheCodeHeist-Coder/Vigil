[project]
name = "vigil"
version = "0.1.0"
description = "Assembly line auditor: catches wrong steps on a live bench and cites the manual."
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiortc>=1.9",
    "confluent-kafka>=2.5",
    "fastapi>=0.115",
    "google-genai>=1.0",
    "httpx>=0.27",
    "mediapipe>=0.10.14",
    "numpy>=1.26,<2.3",
    "opencv-python-headless>=4.10",
    "openvino>=2024.4",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "torch>=2.4",
    "torchvision>=0.19",
    "ultralytics>=8.3",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: needs Kafka or YugabyteDB running"]
